services:
  - type: web
    name: land-link-map
    runtime: node
    plan: free
    region: singapore
    rootDir: land-link-map
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: FAMILY_ACCESS_KEY
        sync: false
      - key: LIVE_SYNC_MINUTES
        value: 30
      - key: DATA_GO_KR_SERVICE_KEY
        sync: false
      - key: KAKAO_REST_API_KEY
        sync: false
      - key: ONBID_SYNC_ENABLED
        value: true
      - key: MUNICIPAL_VACANT_SYNC_ENABLED
        value: true
